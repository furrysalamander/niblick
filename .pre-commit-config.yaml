repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: ["--fix"]
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        args: ["niblick/compiler.py", "niblick/format.py", "niblick/inline.py", "niblick/asm_opt.py", "niblick/loader.py", "niblick/emulator.py", "niblick/parser.py", "niblick/types.py"]
        pass_filenames: false
