[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "niblick"
version = "1.0.0"
description = "A compiler for the Niblick language targeting the Hackaday Supercon.6 (Voja4) 4-bit badge"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Mike Abbott" }]
keywords = ["badge", "supercon6", "voja4", "4-bit", "compiler", "niblick"]
dependencies = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Embedded Systems",
    "Topic :: System :: Hardware",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pyserial>=3.5",
    "build>=1.2",
    "hypothesis>=6.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "z3-solver>=4.13",
    "pre-commit>=3.7",
    "pip-audit>=2.9",
]
lsp = ["pygls>=2.0"]
docs = [
    "sphinx>=9",
    "myst-parser",
    "sphinx-rtd-theme>=3.1",
    "sphinx-copybutton",
    "sphinx-autobuild",
    "sphinx-reredirects",
]

[project.scripts]
niblick = "niblick.cli:main"
niblick-lsp = "niblick.lsp:main"

[project.urls]
Homepage = "https://furrysalamander.github.io/niblick/"
Documentation = "https://furrysalamander.github.io/niblick/docs/"
Repository = "https://github.com/furrysalamander/niblick"
Issues = "https://github.com/furrysalamander/niblick/issues"

[tool.setuptools]
packages = ["niblick", "niblick._vendor", "niblick.runtime"]

[tool.setuptools.package-data]
niblick = ["runtime/*.asm"]

[tool.setuptools.data-files]
"share/niblick/lib" = ["lib/*.nbl"]
"share/niblick/lib/boards" = ["lib/boards/*.nbl"]
"share/niblick/lib/drivers" = ["lib/drivers/*.nbl"]
"share/niblick/lib/drivers/asm" = ["lib/drivers/asm/*.asm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["niblick/_vendor"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = false
follow_imports = "skip"
