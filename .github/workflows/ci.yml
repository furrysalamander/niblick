name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,lsp,fidelity]"
      - name: Test
        run: python -m pytest


  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: mypy
        run: mypy niblick/compiler.py niblick/format.py niblick/inline.py niblick/asm_opt.py niblick/loader.py niblick/emulator.py niblick/parser.py niblick/types.py

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Python audit
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,lsp,fidelity]"
          python -m pip_audit
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            editors/vscode/package-lock.json
      - name: Web audit
        working-directory: web
        run: |
          npm ci
          npm audit
      - name: VS Code extension audit
        working-directory: editors/vscode
        run: |
          npm ci
          npm audit

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,lsp,fidelity]"
      - name: Test with coverage
        run: python -m pytest --cov=niblick --cov-report=term-missing

  extension:
    name: VS Code extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: Install
        working-directory: editors/vscode
        run: npm ci
      - name: Compile
        working-directory: editors/vscode
        run: npm run compile
      - name: Package
        working-directory: editors/vscode
        run: npm run package -- --no-dependencies

  web:
    name: Web editor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build Python assets
        run: |
          python -m pip install --upgrade pip build
          python tools/build_web_assets.py
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Build web app
        working-directory: web
        run: npm run build
      - name: Install Playwright browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        working-directory: web
        run: npm run test:e2e
        env:
          PLAYWRIGHT_CHANNEL: chromium

  package:
    name: Build wheel
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install wheel
        run: python -m pip install dist/*.whl
      - name: Smoke test installed wheel
        working-directory: /tmp
        run: |
          python -m niblick "$GITHUB_WORKSPACE/examples/hello.nbl" --run
          python -m niblick "$GITHUB_WORKSPACE/examples/struct_demo.nbl" --run
          python -m niblick "$GITHUB_WORKSPACE/examples/w5500_probe.nbl" --no-assemble
