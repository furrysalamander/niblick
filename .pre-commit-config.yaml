repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: ["--fix"]
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        args: ["badgec/compiler.py", "badgec/inline.py", "badgec/asm_opt.py", "badgec/loader.py", "badgec/emulator.py"]
        pass_filenames: false
