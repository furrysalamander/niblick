[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "badgec"
version = "0.1.0"
description = "A small C-like compiler for the Hackaday Supercon.6 (Voja4) 4-bit badge"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Mike Abbott" }]
dependencies = [
    "supercon6-assembler @ git+https://github.com/furrysalamander/2022-Supercon6-Badge-Tools.git@c576ebd08d4916909c89497fba1e1158eb540685#subdirectory=assembler",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Embedded Systems",
    "Topic :: System :: Hardware",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyserial>=3.5", "build>=1.2"]
lsp = ["pygls>=2.0"]
fidelity = [
    "supercon6-emulator @ git+https://github.com/furrysalamander/2022-Supercon6-Badge-Tools.git@c576ebd08d4916909c89497fba1e1158eb540685#subdirectory=emulator",
]

[project.scripts]
badgec = "badgec.cli:main"
badgec-lsp = "badgec.lsp:main"

[tool.setuptools]
packages = ["badgec", "badgec.runtime"]

[tool.setuptools.package-data]
badgec = ["runtime/*.asm"]

[tool.setuptools.data-files]
"share/badgec/lib" = ["lib/*.badge", "lib/drivers/*.badge", "lib/drivers/asm/*.asm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
